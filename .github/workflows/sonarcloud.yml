name: SonarQube Cloud
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Build, test and analyze
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install dependencies
        run: |
          sudo apt-get update 
          sudo apt-get install -y cmake libasio-dev curl 
          pipx install gcovr

      - name: Build with coverage
        run: |
          cmake -S . -B build -DCOVERAGE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build

      - name: Run tests
        run: bash tests/smoke_test.sh

      - name: Generate coverage.xml
        run: gcovr --root . --exclude crow_all.h --sonarqube coverage.xml

      - name: Debug coverage
        run: | 
          find build -name "*.gcda"
          gcovr --version
          head -30 coverage.xml

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}